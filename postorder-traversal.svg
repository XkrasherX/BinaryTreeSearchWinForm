<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Postorder traversal of a binary search tree</title>
  <desc id="desc">The traversal visits left subtree, then right subtree, then the node itself. For the example tree, the sequence is c, h, f, p, w, t, m.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101b32"/><stop offset="1" stop-color="#172b45"/></linearGradient>
    <linearGradient id="nodeFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#283f61"/><stop offset="1" stop-color="#1a304d"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#020617" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="1000" height="650" rx="26" fill="url(#bg)"/>
  <circle cx="70" cy="60" r="110" fill="#2dd4bf" opacity="0.05"/><circle cx="945" cy="485" r="160" fill="#fbbf24" opacity="0.04"/>
  <text x="48" y="54" fill="#f0fdfa" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">Postorder Traversal</text>
  <text x="49" y="83" fill="#9fb4cc" font-family="Segoe UI, Arial, sans-serif" font-size="15">Visit both subtrees before visiting their parent</text>
  <g>
    <rect x="48" y="105" width="276" height="42" rx="12" fill="#153a42" stroke="#2dd4bf"/><text x="186" y="132" text-anchor="middle" fill="#99f6e4" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1 · LEFT SUBTREE</text>
    <rect x="362" y="105" width="276" height="42" rx="12" fill="#183b55" stroke="#60a5fa"/><text x="500" y="132" text-anchor="middle" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">2 · RIGHT SUBTREE</text>
    <rect x="676" y="105" width="276" height="42" rx="12" fill="#49351c" stroke="#fbbf24"/><text x="814" y="132" text-anchor="middle" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">3 · ROOT NODE</text>
  </g>
  <g stroke="#6687a9" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M500 195 L300 268"/><path d="M500 195 L700 268"/><path d="M300 312 L190 378"/><path d="M300 312 L410 378"/><path d="M700 312 L590 378"/><path d="M700 312 L810 378"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="500" cy="180" r="33" fill="#49351c" stroke="#fbbf24" stroke-width="2.5"/><circle cx="300" cy="290" r="31" fill="#153a42" stroke="#2dd4bf" stroke-width="2.5"/><circle cx="700" cy="290" r="31" fill="#183b55" stroke="#60a5fa" stroke-width="2.5"/>
    <circle cx="190" cy="399" r="29" fill="#153a42" stroke="#2dd4bf" stroke-width="2.5"/><circle cx="410" cy="399" r="29" fill="#153a42" stroke="#2dd4bf" stroke-width="2.5"/><circle cx="590" cy="399" r="29" fill="#183b55" stroke="#60a5fa" stroke-width="2.5"/><circle cx="810" cy="399" r="29" fill="#183b55" stroke="#60a5fa" stroke-width="2.5"/>
  </g>
  <g text-anchor="middle" dominant-baseline="central" font-family="Consolas, monospace" font-size="23" font-weight="700">
    <text x="500" y="181" fill="#fde68a">m</text><text x="300" y="291" fill="#99f6e4">f</text><text x="700" y="291" fill="#bfdbfe">t</text><text x="190" y="400" fill="#99f6e4">c</text><text x="410" y="400" fill="#99f6e4">h</text><text x="590" y="400" fill="#bfdbfe">p</text><text x="810" y="400" fill="#bfdbfe">w</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle" dominant-baseline="central" font-size="12">
    <circle cx="213" cy="378" r="13" fill="#2dd4bf"/><text x="213" y="379" fill="#063b3a">1</text>
    <circle cx="433" cy="378" r="13" fill="#2dd4bf"/><text x="433" y="379" fill="#063b3a">2</text>
    <circle cx="323" cy="269" r="13" fill="#2dd4bf"/><text x="323" y="270" fill="#063b3a">3</text>
    <circle cx="613" cy="378" r="13" fill="#60a5fa"/><text x="613" y="379" fill="#102b4c">4</text>
    <circle cx="833" cy="378" r="13" fill="#60a5fa"/><text x="833" y="379" fill="#102b4c">5</text>
    <circle cx="723" cy="269" r="13" fill="#60a5fa"/><text x="723" y="270" fill="#102b4c">6</text>
    <circle cx="523" cy="158" r="13" fill="#fbbf24"/><text x="523" y="159" fill="#422006">7</text>
  </g>
  <rect x="48" y="462" width="904" height="126" rx="18" fill="#12243b" stroke="#29445f"/>
  <text x="76" y="493" fill="#9fb4cc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">VISIT ORDER</text>
  <g font-family="Consolas, monospace" font-size="22" font-weight="700" text-anchor="middle">
    <rect x="76" y="511" width="88" height="48" rx="12" fill="#153a42" stroke="#2dd4bf"/><text x="120" y="541" fill="#99f6e4">c</text>
    <text x="184" y="541" fill="#7894b1">→</text>
    <rect x="207" y="511" width="88" height="48" rx="12" fill="#153a42" stroke="#2dd4bf"/><text x="251" y="541" fill="#99f6e4">h</text>
    <text x="315" y="541" fill="#7894b1">→</text>
    <rect x="338" y="511" width="88" height="48" rx="12" fill="#153a42" stroke="#2dd4bf"/><text x="382" y="541" fill="#99f6e4">f</text>
    <text x="446" y="541" fill="#7894b1">→</text>
    <rect x="469" y="511" width="88" height="48" rx="12" fill="#183b55" stroke="#60a5fa"/><text x="513" y="541" fill="#bfdbfe">p</text>
    <text x="577" y="541" fill="#7894b1">→</text>
    <rect x="600" y="511" width="88" height="48" rx="12" fill="#183b55" stroke="#60a5fa"/><text x="644" y="541" fill="#bfdbfe">w</text>
    <text x="708" y="541" fill="#7894b1">→</text>
    <rect x="731" y="511" width="88" height="48" rx="12" fill="#183b55" stroke="#60a5fa"/><text x="775" y="541" fill="#bfdbfe">t</text>
    <text x="839" y="541" fill="#7894b1">→</text>
    <rect x="862" y="511" width="58" height="48" rx="12" fill="#49351c" stroke="#fbbf24"/><text x="891" y="541" fill="#fde68a">m</text>
  </g>
  <text x="500" y="622" text-anchor="middle" fill="#9fb4cc" font-family="Segoe UI, Arial, sans-serif" font-size="14">For this tree, postorder() returns: c h f p w t m</text>
</svg>
